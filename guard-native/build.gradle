plugins {
    alias(libs.plugins.android.library)
}

android {
    namespace 'com.fy.guard_native'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        minSdk 24

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
        externalNativeBuild {
            cmake {
                // -O2:                    优化级别 2（性能与编译时间平衡）
                // -fvisibility=hidden:    隐藏所有符号（减小 SO 体积，增加逆向难度）
                // -fstack-protector-strong: 栈保护（防止栈溢出攻击）
                cFlags '-O2 -fvisibility=hidden -fstack-protector-strong'

                // 密钥注入（从 gradle.properties 读取）
                arguments "-DFY_MASTER_KEY=${rootProject.findProperty('FY_MASTER_KEY') ?: ''}"
            }
        }

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {

            // strip 所有调试符号（生产环境）
            packagingOptions {
                jniLibs {
                    keepDebugSymbols += ['**/*.so']
                }
            }
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core
}